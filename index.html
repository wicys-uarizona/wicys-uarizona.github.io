<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WiCyS UArizona</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: a 3D desk "lobby" you click into, then a dark chapter HQ with a reactive dot field behind every page.
   Single committed dark world, colors pulled from the chapter logo. */
:root{
  --ink:#110c17; --panel:#1a1322; --panel-2:#221a2d; --line:#33284a;
  --fg:#efeaf4; --mute:#a99fb8; --dim:#6f6585;
  --plum:#a24fb2; --plum-deep:#7b2a87; --lime:#b5d63f; --steel:#6fa3c0; --sage:#b9cba6; --gold:#d9be6c;
  --f-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font:16px/1.6 var(--f-body);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:inherit}
[data-go]{cursor:pointer}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
@media (pointer:fine){body.custom-cursor,body.custom-cursor a,body.custom-cursor button{cursor:none}}

/* ---------- cursor + fx ---------- */
.cur-dot,.cur-ring{position:fixed;left:0;top:0;pointer-events:none;z-index:200;border-radius:50%;display:none}
body.custom-cursor .cur-dot,body.custom-cursor .cur-ring{display:block}
.cur-dot{width:6px;height:6px;margin:-3px 0 0 -3px;background:var(--lime)}
.cur-ring{width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid color-mix(in srgb,var(--plum) 80%,white);transition:width .2s,height .2s,margin .2s,border-color .2s,background .2s}
.cur-ring.hot{width:58px;height:58px;margin:-29px 0 0 -29px;border-color:var(--lime);background:color-mix(in srgb,var(--lime) 8%,transparent)}
.cur-ring.down{width:22px;height:22px;margin:-11px 0 0 -11px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:190}
#field,#rain{position:fixed;inset:0;z-index:0;pointer-events:none}
#rain{display:none}

/* ---------- intro (3D desk) ---------- */
#intro{position:fixed;inset:0;z-index:80;background:#0e0a14;transition:opacity .7s ease}
#intro.gone{opacity:0;pointer-events:none}
#scene{display:block;width:100%;height:100%}
.hud{position:absolute;pointer-events:none;font:12px/1.4 var(--f-mono);color:var(--mute);letter-spacing:.04em}
.hud-tl{top:calc(18px + env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px))}
.hud-tl b{color:var(--lime);font-weight:600}
.hud-bottom{left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;padding-inline:16px;text-align:center}
.hud-bottom .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
.hint kbd{font:inherit;color:var(--fg);border:1px solid var(--line);padding:1px 6px;border-radius:4px;background:var(--panel)}
#tip{position:absolute;pointer-events:none;font:12px var(--f-mono);background:color-mix(in srgb,var(--ink) 85%,transparent);border:1px solid var(--line);color:var(--fg);padding:5px 9px;border-radius:4px;transform:translate(14px,14px);white-space:nowrap;display:none;z-index:2}
#tip span{color:var(--lime)}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:
  repeating-linear-gradient(0deg,rgba(181,214,63,.12) 0 2px,transparent 2px 4px),radial-gradient(circle at 50% 50%,#1c2a10 0%,#0b0d12 70%)}
.no-webgl #scene{display:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font:600 14px var(--f-body);text-decoration:none;cursor:pointer;transition:background .2s,border-color .2s,color .2s;will-change:transform}
.btn:hover{border-color:var(--plum)}
.btn.primary{background:var(--lime);color:#18200a;border-color:var(--lime)}
.btn.primary:hover{background:#c6e65a}
.btn.ghost{background:transparent}
.btn .arr{font-family:var(--f-mono)}

/* ---------- site shell ---------- */
#site{position:relative;z-index:1;min-height:100%}
#site[hidden]{display:none!important}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--ink) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:10px}
.brand{display:flex;align-items:center;text-decoration:none}
.brand img{height:38px;width:auto;display:block}
nav.links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.links a{position:relative;text-decoration:none;font:600 15px/1 var(--f-display);letter-spacing:.03em;cursor:pointer;padding:10px 12px;color:var(--mute);border-radius:4px;transition:color .2s}
nav.links a:hover,nav.links a.on{color:var(--fg)}
nav.links a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:2px;background:var(--lime)}
nav.links a.term{color:var(--lime);font-family:var(--f-mono);text-transform:none;letter-spacing:0}
nav.links a.joinlink{color:#18200a;background:var(--lime);margin-left:6px}
nav.links a.joinlink.on::after{display:none}
nav.links a.joinlink:hover{background:#c6e65a;color:#18200a}
@media (max-width:760px){
  .top .wrap{flex-wrap:wrap;gap:6px}
  nav.links{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0}
  nav.links a{padding:9px 9px;font-size:13.5px;letter-spacing:.02em;white-space:nowrap}
  .brand img{height:30px}
  nav.links .long,nav.links a.term{display:none}
}

/* ---------- join band (end of every page) ---------- */
.joinband{margin-top:24px;border-top:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--plum-deep) 35%,var(--ink)),var(--ink) 70%)}
.joinband .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-block:40px}
.joinband h3{font-size:clamp(24px,3vw,34px)}
.joinband p{color:var(--mute);margin-top:6px}

/* ---------- certification program ---------- */
.cert-hero{padding-block:52px 32px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:center}
@media (max-width:900px){.cert-hero{grid-template-columns:1fr;gap:24px;padding-block:36px 20px}}
.cert-hero h1{font-size:clamp(40px,6.5vw,76px);line-height:.95}
.cert-hero h1 em{font-style:normal;color:var(--lime)}
.cert-hero .lede{color:var(--mute);font-size:18px;max-width:54ch;margin-top:18px}
.deadline{border:1px solid color-mix(in srgb,var(--gold) 60%,var(--line));border-radius:12px;padding:24px;background:var(--panel);display:flex;flex-direction:column;gap:16px}
.deadline .eyebrow{color:var(--gold)}
.deadline .big{font:700 34px/1 var(--f-display)}
.duo{width:100%;height:auto;display:block}
.tracks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:760px){.tracks{grid-template-columns:1fr}}
.track{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:28px;display:flex;flex-direction:column;gap:14px}
.track:hover{border-color:var(--c)}
.track .name{font:700 40px/1 var(--f-display);color:var(--c)}
.track .code{margin-top:8px;font:600 12px var(--f-mono);color:var(--dim);letter-spacing:.1em}
.track ul{margin:0;padding-left:20px;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.track li::marker{color:var(--c)}
.seats{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seat{width:44px;height:44px;border-radius:10px;border:1.5px dashed var(--c);display:grid;place-items:center;font:600 11px var(--f-mono);color:var(--c);cursor:pointer;transition:background .2s,transform .2s}
.seat:hover{transform:translateY(-3px)}
.seat.taken{background:var(--c);color:#14101a;border-style:solid}
.seat-link{width:18px;height:2px;background:var(--c);opacity:.6}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;counter-reset:s}
@media (max-width:980px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}
.step{border:1px solid var(--line);border-radius:10px;padding:20px;background:var(--panel);display:flex;flex-direction:column;gap:8px;counter-increment:s}
.step::before{content:counter(s,decimal-leading-zero);font:700 13px var(--f-mono);color:var(--lime)}
.step b{font:600 18px var(--f-display)}
.step span{color:var(--mute);font-size:14.5px}

/* ---------- join ---------- */
.join-hero{padding-block:52px 28px;max-width:760px;display:flex;flex-direction:column;gap:16px}
.join-hero h1{font-size:clamp(42px,7vw,84px);line-height:.95}
.join-hero h1 span{color:var(--lime)}
.join-hero p{color:var(--mute);font-size:18px}
.progress{display:flex;align-items:center;gap:14px;font:600 13px var(--f-mono);color:var(--mute)}
.progress .bar{flex:1;max-width:360px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--plum),var(--lime));transition:width .5s cubic-bezier(.2,.7,.2,1)}
.quest{display:flex;flex-direction:column;gap:12px;max-width:860px;padding-bottom:56px}
.q{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:18px;align-items:start;padding:22px;border:1px solid var(--line);border-radius:12px;background:var(--panel);transition:border-color .25s,background .25s}
@media (max-width:600px){.q{grid-template-columns:40px minmax(0,1fr);gap:14px;padding:18px}.q .check{grid-column:1/-1;justify-self:start}}
.q .num{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:700 16px var(--f-mono);color:var(--mute);transition:all .25s}
@media (max-width:600px){.q .num{width:38px;height:38px;font-size:14px}}
.q h3{font-size:21px}
.q p{color:var(--mute);margin-top:6px;font-size:15.5px}
.q .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.q code{font:13px var(--f-mono);background:var(--panel-2);border:1px solid var(--line);padding:1px 6px;border-radius:4px;color:var(--fg)}
.q .check{font:600 12px var(--f-mono);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;white-space:nowrap}
.q.done{border-color:color-mix(in srgb,var(--lime) 55%,var(--line));background:color-mix(in srgb,var(--lime) 6%,var(--panel))}
.q.done .num{background:var(--lime);border-color:var(--lime);color:#18200a}
.q.done .check{border-color:var(--lime);color:var(--lime)}
.q .opt{font:600 10.5px var(--f-mono);letter-spacing:.1em;color:var(--steel);text-transform:uppercase;margin-left:8px;vertical-align:middle}
.welcome{display:none;padding:28px;border-radius:12px;border:1px solid var(--lime);background:color-mix(in srgb,var(--lime) 10%,var(--panel))}
.welcome.show{display:block;animation:pageIn .5s ease both}
.welcome h3{font-size:28px}
.welcome p{color:var(--mute);margin-top:6px}

main{min-height:70vh}
.page{animation:pageIn .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(14px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.scan{position:fixed;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--lime),var(--plum),transparent);z-index:45;pointer-events:none;transform:translateY(-10px);opacity:0}
.scan.go{animation:scan .7s ease-out}
@keyframes scan{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(100vh)}}

.eyebrow{font:600 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
h1,h2,h3{font-family:var(--f-display);line-height:1.08;text-wrap:balance;margin:0;font-weight:700}
h2{font-size:clamp(28px,4vw,44px)}
h3{font-size:20px;font-weight:600}
p{margin:0}
.section{padding-block:72px}
.section-head{display:flex;flex-direction:column;gap:12px;margin-bottom:32px;max-width:62ch}
.section-head p{color:var(--mute)}

/* ---------- home ---------- */
.hero{padding-block:56px 40px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:start}
.hero .reel{margin-top:28px}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:32px;padding-block:36px 24px}}
.hero-copy{display:flex;flex-direction:column;gap:22px;min-width:0}
.hero h1{font-size:clamp(44px,7vw,88px);letter-spacing:-.01em;line-height:.95}
.hero h1 .w{color:var(--plum)}
.hero h1 .c{color:var(--lime)}
.hero .lede{font-size:18px;color:var(--mute);max-width:52ch}
.typed{font:14px/1.6 var(--f-mono);color:var(--fg);height:1.6em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.typed .p{color:var(--lime)}
.typed .caret{display:inline-block;width:.6em;height:1.1em;vertical-align:-.15em;background:var(--lime);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}

.reel{position:relative;aspect-ratio:16/11;max-width:100%;border-radius:10px;overflow:hidden;background:#0b0810;border:1px solid var(--line)}
.reel video,.reel canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.reel .corner{position:absolute;width:22px;height:22px;border:2px solid var(--lime);pointer-events:none}
.reel .c1{top:10px;left:10px;border-right:0;border-bottom:0}.reel .c2{top:10px;right:10px;border-left:0;border-bottom:0}
.reel .c3{bottom:10px;left:10px;border-right:0;border-top:0}.reel .c4{bottom:10px;right:10px;border-left:0;border-top:0}
.reel .rec{position:absolute;top:16px;left:44px;font:600 11px var(--f-mono);letter-spacing:.12em;color:var(--fg);display:flex;align-items:center;gap:8px}
.reel .rec i{width:8px;height:8px;border-radius:50%;background:#ff5a6a;animation:blink 1.2s steps(1) infinite}
.reel .lbl{position:absolute;bottom:16px;left:44px;right:44px;font:11px var(--f-mono);color:var(--mute);letter-spacing:.1em;text-transform:uppercase}

.next{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:28px;align-items:center;padding:24px 28px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(110deg,color-mix(in srgb,var(--plum-deep) 40%,var(--panel)) 0%,var(--panel) 55%);text-decoration:none;position:relative;overflow:hidden}
.next:hover{border-color:var(--plum)}
@media (max-width:760px){.next{grid-template-columns:1fr;gap:16px;padding:20px}}
.datebox{font-family:var(--f-display);text-align:center;line-height:1;border:1px solid color-mix(in srgb,var(--lime) 60%,transparent);border-radius:8px;padding:12px 16px;min-width:84px;justify-self:start}
.datebox .m{font-size:13px;letter-spacing:.14em;color:var(--lime);text-transform:uppercase}
.datebox .d{font-size:40px;font-weight:700;margin-top:4px}
.next h3{font-size:clamp(20px,2.4vw,28px);margin-top:6px}
.next .meta{color:var(--mute);font-size:14px;margin-top:6px}
.count{display:flex;gap:10px;font-family:var(--f-mono)}
.count div{text-align:center;min-width:52px}
.count b{display:block;font:700 28px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--fg)}
.count span{font-size:10px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}

.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:980px){.pillars{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.pillars{grid-template-columns:1fr}}
.tilt{transform-style:preserve-3d;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease;position:relative}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.09),transparent 60%)}
.tilt:hover::after{opacity:1}
.pillar{display:flex;flex-direction:column;gap:12px;padding:24px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-decoration:none;min-height:230px}
.pillar:hover{border-color:var(--c,var(--plum))}
.pillar .tag{font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--lime))}
.pillar p{color:var(--mute);font-size:15px}
.pillar .go{margin-top:auto;font:600 13px var(--f-mono);color:var(--c,var(--lime))}
.glyph{width:42px;height:42px}

.meet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.meet{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:28px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel p{color:var(--mute)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:15px}
.kv dt{font:600 12px/2 var(--f-mono);color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.kv dd{margin:0}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.officer{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--panel-2)}
.officer b{display:block;font:600 16px var(--f-display)}
.officer span{font-size:13px;color:var(--mute)}
.open-chairs{border:1px dashed color-mix(in srgb,var(--gold) 70%,transparent);border-radius:8px;padding:14px 16px;font-size:14px;color:var(--mute)}
.open-chairs b{color:var(--gold)}

footer{border-top:1px solid var(--line);margin-top:40px}
footer .wrap{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;align-items:center;padding-block:28px;color:var(--dim);font:13px var(--f-mono)}
footer a{color:var(--mute)}

/* ---------- events / calendar ---------- */
.ev-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;font:600 12px var(--f-mono);letter-spacing:.04em;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;transition:opacity .2s,border-color .2s}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.45}
.chip:hover{border-color:var(--c,var(--plum))}
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:960px){.cal-layout{grid-template-columns:1fr}}
.cal{border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--panel) 72%,transparent);overflow:hidden;min-width:0}
.cal-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);gap:12px}
.cal-bar h3{font-size:24px;letter-spacing:.02em}
.cal-bar h3 span{color:var(--mute);font-weight:500}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center;cursor:pointer;font:600 16px var(--f-mono)}
.icon-btn:hover{border-color:var(--lime);color:var(--lime)}
.icon-btn:disabled{opacity:.3;pointer-events:none}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{font:600 11px var(--f-mono);letter-spacing:.12em;color:var(--dim);text-transform:uppercase;padding:10px 10px 6px}
.grid{animation:pageIn .4s ease both}
.day{min-height:112px;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:5px;position:relative;cursor:pointer;transition:background .2s;min-width:0}
.day:nth-child(7n){border-right:0}
.day:hover{background:var(--panel-2)}
.day.out{opacity:.28}
.day .n{font:600 13px var(--f-mono);color:var(--mute);font-variant-numeric:tabular-nums}
.day.today .n{color:var(--ink);background:var(--lime);border-radius:4px;padding:0 5px;align-self:flex-start}
.day.sel{background:color-mix(in srgb,var(--plum-deep) 22%,var(--panel))}
.ev-chip{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);padding:4px 6px;border-radius:3px;font:600 11.5px/1.25 var(--f-body);color:var(--fg);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:transform .15s,background .15s}
.ev-chip:hover{transform:translateX(2px);background:color-mix(in srgb,var(--c) 30%,transparent)}
.ev-chip.tbc{border-left-style:dashed}
@media (max-width:640px){
  .day{min-height:58px;padding:6px 4px;align-items:center}
  .ev-chip{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:var(--c);font-size:0;display:inline-block}
  .day .chips{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
  .dow div{padding:8px 0;text-align:center;font-size:10px;letter-spacing:.04em}
}
.day .chips{display:flex;flex-direction:column;gap:4px;min-width:0}
.agenda{display:flex;flex-direction:column;gap:10px}
.agenda h4{font:600 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 4px}
.ag-item{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;padding:14px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--panel) 80%,transparent);text-decoration:none;align-items:center;transition:border-color .2s,transform .2s}
.ag-item:hover{border-color:var(--c);transform:translateX(3px)}
.ag-item .db{text-align:center;font-family:var(--f-display);line-height:1}
.ag-item .db b{display:block;font-size:24px}
.ag-item .db span{font-size:11px;letter-spacing:.12em;color:var(--c);text-transform:uppercase}
.ag-item h5{margin:0 0 3px;font:600 15px/1.25 var(--f-body)}
.ag-item .sub{font-size:12.5px;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--c,var(--line));color:var(--c,var(--mute))}
.pill.solid{background:var(--c);color:#14101a;border-color:var(--c)}
.legend-note{font-size:12.5px;color:var(--dim);margin-top:10px}
.empty{padding:18px;border:1px dashed var(--line);border-radius:8px;color:var(--mute);font-size:14px}

/* ---------- event detail ---------- */
.back{display:inline-flex;gap:8px;align-items:center;font:600 13px var(--f-mono);color:var(--mute);text-decoration:none;margin-top:32px}
.back:hover{color:var(--lime)}
.ev-hero{padding-block:24px 36px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.ev-hero h1{font-size:clamp(36px,6vw,68px);max-width:18ch}
.ev-meta{display:flex;gap:10px 28px;flex-wrap:wrap;font-size:15px;color:var(--mute)}
.ev-meta b{color:var(--fg);font-weight:600}
.ev-body{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:40px;padding-block:40px}
@media (max-width:900px){.ev-body{grid-template-columns:1fr}}
.prose{display:flex;flex-direction:column;gap:16px;max-width:66ch;font-size:17px}
.prose h2{font-size:26px;margin-top:12px}
.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--fg)}
.prose li::marker{color:var(--lime)}
.side{display:flex;flex-direction:column;gap:14px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:6px}
.res{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-decoration:none;transition:border-color .2s}
.res:hover{border-color:var(--lime)}
.res .k{font:600 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.res b{font-size:15.5px}
.res span{font-size:13px;color:var(--mute)}
.res .u{font:11px var(--f-mono);color:var(--dim);overflow-wrap:anywhere}
.recording{aspect-ratio:16/9;max-width:100%;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;color:var(--mute);font:13px var(--f-mono);padding:16px;background:repeating-linear-gradient(135deg,transparent 0 12px,color-mix(in srgb,var(--line) 35%,transparent) 12px 13px)}
.pn{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:24px;border-top:1px solid var(--line)}
.pn a{max-width:48%;text-decoration:none;color:var(--mute);font-size:14px}
.pn a b{display:block;color:var(--fg);font-family:var(--f-display);font-size:18px}
.pn a:hover b{color:var(--lime)}

/* ---------- speakers / CyHer Exchange ---------- */
.cyher-hero{padding-block:56px 32px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;align-items:end}
@media (max-width:860px){.cyher-hero{grid-template-columns:1fr;gap:20px;padding-block:36px 20px}}
.wordmark{font:700 clamp(54px,10vw,128px)/.86 var(--f-display);letter-spacing:-.02em}
.wordmark .cy{color:var(--fg)}
.wordmark .her{color:var(--lime);font-style:italic}
.wordmark .ex{display:block;color:transparent;-webkit-text-stroke:1.5px var(--plum);letter-spacing:.02em}
.cyher-hero p{color:var(--mute);font-size:17px;max-width:46ch}
.lvl-filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 28px}
.tickets{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:20px}
@media (max-width:980px){.tickets{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.tickets{grid-template-columns:1fr}}
.ticket{perspective:1200px;min-height:320px;cursor:pointer;border:0;background:none;padding:0;text-align:left;display:block;width:100%}
.ticket.hide{display:none}
.t-inner{position:relative;width:100%;height:100%;min-height:320px;transition:transform .7s cubic-bezier(.3,.8,.2,1);transform-style:preserve-3d}
.ticket.flip .t-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;border:1px solid var(--line);background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg);padding:24px;gap:12px;background:linear-gradient(160deg,var(--panel-2),var(--panel))}
.face .art{height:150px;position:relative;background:var(--c2,var(--plum-deep));overflow:hidden}
.face .art canvas{position:absolute;inset:0;width:100%;height:100%}
.face .sess{position:absolute;top:12px;left:16px;font:700 13px var(--f-mono);letter-spacing:.12em;color:#fff;mix-blend-mode:normal;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.face .mono{position:absolute;right:16px;bottom:-16px;font:700 88px/1 var(--f-display);color:rgba(255,255,255,.92);letter-spacing:-.04em}
.perf{height:0;border-top:2px dashed var(--line);margin:0 16px;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--ink);border:1px solid var(--line)}
.perf::before{left:-27px}.perf::after{right:-27px}
.face .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.face h3{font-size:24px}
.face .role{color:var(--mute);font-size:14px}
.face .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lvl{display:inline-flex;align-items:center;gap:8px;font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.lvl .bars{display:inline-flex;gap:3px;align-items:flex-end}
.lvl .bars i{width:5px;border-radius:1px;background:var(--line)}
.lvl .bars i:nth-child(1){height:7px}.lvl .bars i:nth-child(2){height:11px}.lvl .bars i:nth-child(3){height:15px}
.lvl .bars i.on{background:var(--c)}
.face.back p{color:var(--mute);font-size:14.5px}
.face.back .kv{font-size:14px}
.face.back .btn{margin-top:auto;align-self:flex-start}
.flip-hint{font:11px var(--f-mono);color:var(--dim)}
.ticket.locked .face{border-style:dashed}
.ticket.locked .art{background:repeating-linear-gradient(45deg,var(--panel-2) 0 10px,var(--panel) 10px 20px)}
.group-label{display:flex;align-items:center;gap:14px;margin:48px 0 18px;font:600 13px var(--f-mono);letter-spacing:.06em;color:var(--mute)}
.group-label::after{content:"";flex:1;height:1px;background:var(--line)}
.pitch{margin-top:48px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:28px;border-radius:10px;border:1px solid var(--line);background:linear-gradient(100deg,var(--panel),color-mix(in srgb,var(--lime) 10%,var(--panel)))}
.pitch h3{font-size:24px}
.pitch p{color:var(--mute);margin-top:6px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head><body>

const rain=$("#rain"), rc=rain.getContext("2d"); let rainOn=false, rainRaf=0, drops=[], rainT=0;
const RCOL=19, RSTEP=18;
function newDrop(x,first){return {x,y:first?Math.random()*innerHeight:-Math.random()*innerHeight*.6,v:34+Math.random()*40,on:Math.random()<.92,len:12+(Math.random()*18|0),ch:Array.from({length:20},()=>Math.random()<.5?"0":"1")}}
function sizeRain(){const d=Math.min(devicePixelRatio,2);rain.width=innerWidth*d;rain.height=innerHeight*d;rc.setTransform(d,0,0,d,0,0);
  drops=Array.from({length:Math.ceil(innerWidth/RCOL)},(_,i)=>newDrop(i*RCOL+8,true))}
sizeRain(); addEventListener("resize",sizeRain);
function startRain(){ if(rainOn) return; rainOn=true; rain.style.display="block"; rainT=performance.now(); drawRain() }
function stopRain(){ rainOn=false; cancelAnimationFrame(rainRaf); rain.style.display="none" }
function drawRain(now=performance.now()){ if(!rainOn) return;
  const dt=Math.min(.05,(now-rainT)/1000); rainT=now; const H=innerHeight;
  rc.clearRect(0,0,innerWidth,H); rc.font='600 14px "JetBrains Mono",monospace'; rc.textAlign="center";
  for(const r of drops){ if(!r.on){ r.y+=r.v*dt; if(r.y>H){Object.assign(r,newDrop(r.x))} continue }
    if(!reduced) r.y+=r.v*dt;
    if(Math.random()<.02) r.ch[Math.random()*r.ch.length|0]=Math.random()<.5?"0":"1";
    for(let k=0;k<r.len;k++){ const y=r.y-k*RSTEP; if(y<-20||y>H+20) continue;
      const near=Math.max(0,1-Math.hypot(r.x-mouse.x,y-mouse.y)/140);
      const a=(k===0?.7:.45*(1-k/r.len))+near*.3;
      rc.fillStyle=k===0?`rgba(181,214,63,${a})`:`rgba(162,79,178,${a})`;
      rc.fillText(r.ch[k%r.ch.length],r.x,y) }
    if(r.y-r.len*RSTEP>H) Object.assign(r,newDrop(r.x)) }
  if(!reduced) rainRaf=requestAnimationFrame(drawRain) }

function startReel(){ cancelAnimationFrame(reelRaf); const c=$("#reel-c"); const t0=performance.now();

function drawCal(){
  const {y,m}=calState, first=new Date(y,m,1), startDow=first.getDay(), dim=new Date(y,m+1,0).getDate();
  $("#cal-title").innerHTML=`${MONTHS[m]} <span>${y}</span>`;
  const [lo,hi]=monthKeys(); $("#prev").disabled=y*12+m<=lo; $("#nextm").disabled=y*12+m>=hi;
  const evs=sorted.filter(e=>calState.filters.has(e.type));
  const cells=Math.ceil((startDow+dim)/7)*7, t=today0(); let html="";
  for(let i=0;i<cells;i++){ const d=new Date(y,m,i-startDow+1), inM=d.getMonth()===m;
    const list=evs.filter(e=>+parseD(e.date)===+d);
    const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    html+=`<div class="day ${inM?"":"out"} ${+d===+t?"today":""} ${calState.sel===iso?"sel":""}" data-d="${iso}" role="button" tabindex="${inM?0:-1}" aria-label="${d.toDateString()}${list.length?`, ${list.length} event${list.length>1?"s":""}`:""}">
      <span class="n">${d.getDate()}</span><div class="chips">${list.map(e=>`<a class="ev-chip ${e.tbc?"tbc":""}" href="#e-${e.id}" style="--c:${TYPES[e.type].c}" title="${esc(e.title)}${e.tbc?" (date TBC)":""}">${esc(e.title)}</a>`).join("")}</div></div>` }
  const g=$("#grid"); g.style.animation="none"; g.offsetHeight; g.style.animation=""; g.innerHTML=html;
  $$(".day",g).forEach(el=>{const pick=()=>{calState.sel=calState.sel===el.dataset.d?null:el.dataset.d;drawCal()};
    el.addEventListener("click",e=>{if(e.target.closest(".ev-chip"))return;pick()}); el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick()}})});
  // agenda
  let items, head;
  if(calState.sel){ items=evs.filter(e=>e.date===calState.sel); head=parseD(calState.sel).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"}) }
  else { items=evs.filter(e=>{const d=parseD(e.date);return d.getMonth()===m&&d.getFullYear()===y}); head=`${MONTHS[m]} at a glance` }
  $("#agenda").innerHTML=`<h4>${head}</h4>${items.length?items.map(agItem).join(""):`<div class="empty">${calState.sel?"Nothing on this day. Pick another, or clear the selection by clicking it again.":"Nothing scheduled with these filters."}</div>`}

  linkify($(".cal-layout"));
}

function ticket(s){

function drawArt(c){ const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio,2); c.width=Math.max(1,r.width*d); c.height=Math.max(1,r.height*d);
  const g=c.getContext("2d"),W=c.width,H=c.height; let s=+c.dataset.seed||1; const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  const pal=["#7b2a87","#a24fb2","#b5d63f","#6fa3c0","#b9cba6","#d9be6c"]; g.fillStyle=pal[s%2]; g.fillRect(0,0,W,H);
  for(let i=0;i<7;i++){g.fillStyle=pal[Math.floor(rnd()*pal.length)];g.globalAlpha=.75;const sh=rnd();
    if(sh<.4){g.beginPath();g.arc(rnd()*W,rnd()*H,(.15+rnd()*.35)*H,0,7);g.fill()}
    else if(sh<.75){g.save();g.translate(rnd()*W,rnd()*H);g.rotate(rnd()*Math.PI);g.fillRect(-W*.3,-H*.08,W*.6,H*.16);g.restore()}
    else{g.beginPath();g.moveTo(rnd()*W,0);g.lineTo(rnd()*W,H);g.lineTo(rnd()*W,H);g.fill()}}
  g.globalAlpha=.25;g.fillStyle="#110c17";for(let x=0;x<W;x+=8*d)for(let y=0;y<H;y+=8*d)g.fillRect(x,y,1.2*d,1.2*d); g.globalAlpha=1 }

function linkify(root=document){ $$('a[href^="#"]',root).forEach(a=>{ const r=a.getAttribute("href").slice(1); a.removeAttribute("href"); a.dataset.go=r;
  if(!a.hasAttribute("tabindex")) a.tabIndex=0; a.setAttribute("role","link") }) }
function onGo(e){ const el=e.target.closest&&e.target.closest("[data-go]"); if(!el||e.defaultPrevented) return;
  if(e.type==="keydown"&&e.key!=="Enter") return; e.preventDefault(); const r=el.dataset.go;
  if(r==="terminal") return openIntro(); if(el.id==="to-apply") return; go(r) }
document.addEventListener("click",onGo); document.addEventListener("keydown",onGo);

function render(){
  const h=currentRoute||"home";
  if(h==="terminal"){ openIntro(); return }
  if($("#site").hidden){ // deep link straight past the intro
    intro.classList.add("gone"); intro.hidden=true; introAPI&&introAPI.stop(); $("#site").hidden=false; startField() }
  cancelAnimationFrame(reelRaf); clearTimeout(typedTimer); clearInterval(countTimer);
  if(h==="events") pageEvents(); else if(h==="speakers") pageSpeakers(); else if(h==="certs") pageCerts(); else if(h==="join") pageJoin(); else if(h.startsWith("e-")) pageEvent(h.slice(2)); else pageHome();
  if(h!=="join") view.insertAdjacentHTML("beforeend",joinBand());
  if(h==="events"){stopField();startRain()} else {stopRain();startField()}
  const top=h.startsWith("e-")?"events":h; $$("nav.links a[data-nav]").forEach(a=>a.classList.toggle("on",a.dataset.nav===top));
  const sc=$("#scan"); sc.classList.remove("go"); sc.offsetWidth; sc.classList.add("go");
  linkify(); scrollTo({top:0,behavior:"instant"in window?"instant":"auto"});
}
addEventListener("hashchange",()=>{const h=location.hash.slice(1); if(h&&h!==currentRoute){currentRoute=h;render()}});

/* ---------- boot ---------- */
(function init(){
  stopField();
  const h=location.hash.slice(1); currentRoute=h||"home";
  introAPI=buildIntro();
  if(!introAPI) document.documentElement.classList.add("no-webgl");
  if(h && h!=="terminal"){ render(); return }
  if(introAPI) introAPI.start(); else { finishDive("home") }
})();
</script>

</body></html>
